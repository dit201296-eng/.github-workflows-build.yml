name: Fast All-In-One APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files & Code
        run: |
          mkdir -p app/src/main/java/com/lan/screenshare

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenShareLAN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lan.screenshare'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lan.screenshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.lan.screenshare">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <application
                  android:label="ZeroTier Screen"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".StreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lan/screenshare/MainActivity.kt
          package com.lan.screenshare

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import java.io.ByteArrayOutputStream
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var projMgr: MediaProjectionManager
              private lateinit var statusTxt: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 100, 50, 50)
                  }

                  statusTxt = TextView(this).apply {
                      text = "عناوين IP الخاصة بالجهاز:\n${getLocalIpAddresses()}\n\nافتح المتصفح في الهاتف الآخر واكتب:\nhttp://[ZeroTier-IP]:8080"
                      textSize = 16f
                  }

                  val btnStart = Button(this).apply {
                      text = "بدء مشاركة الشاشة (إذن رسمي)"
                      setOnClickListener {
                          startActivityForResult(projMgr.createScreenCaptureIntent(), 100)
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "إيقاف المشاركة"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, StreamService::class.java))
                          statusTxt.text = "تم إيقاف البث."
                      }
                  }

                  layout.addView(statusTxt)
                  layout.addView(btnStart)
                  layout.addView(btnStop)
                  setContentView(layout)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, StreamService::class.java).apply {
                          putExtra("code", resultCode)
                          putExtra("data", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      statusTxt.text = "البث يعمل الآن في الخلفية!\nافتح في الهاتف الآخر الرابط:\nhttp://[ZeroTier-IP]:8080"
                  }
              }

              private fun getLocalIpAddresses(): String {
                  val ips = mutableListOf<String>()
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          for (addr in intf.inetAddresses) {
                              if (!addr.isLoopbackAddress && addr.hostAddress?.contains(':') == false) {
                                  ips.add("${intf.displayName}: ${addr.hostAddress}")
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return ips.joinToString("\n")
              }
          }

          class StreamService : Service() {
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var serverSocket: ServerSocket? = null
              @Volatile private var running = false
              @Volatile private var latestJpeg: ByteArray? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotification()
                  val code = intent?.getIntExtra("code", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data = intent.getParcelableExtra<Intent>("data") ?: return START_NOT_STICKY

                  val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mgr.getMediaProjection(code, data)

                  val metrics = resources.displayMetrics
                  val width = 720
                  val height = (metrics.heightPixels * (720f / metrics.widthPixels)).toInt()

                  imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
                  virtualDisplay = projection?.createVirtualDisplay(
                      "ZeroTierStream", width, height, metrics.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader?.surface, null, null
                  )

                  running = true
                  startCaptureLoop(width, height)
                  startHttpServer()

                  return START_STICKY
              }

              private fun startCaptureLoop(w: Int, h: Int) {
                  thread {
                      while (running) {
                          val img = imageReader?.acquireLatestImage()
                          if (img != null) {
                              try {
                                  val planes = img.planes
                                  val buffer = planes[0].buffer
                                  val pixelStride = planes[0].pixelStride
                                  val rowStride = planes[0].rowStride
                                  val rowPadding = rowStride - pixelStride * w

                                  val bmp = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                                  bmp.copyPixelsFromBuffer(buffer)
                                  val cropped = Bitmap.createBitmap(bmp, 0, 0, w, h)

                                  val out = ByteArrayOutputStream()
                                  cropped.compress(Bitmap.CompressFormat.JPEG, 55, out)
                                  latestJpeg = out.toByteArray()

                                  cropped.recycle()
                                  bmp.recycle()
                              } catch (e: Exception) {
                              } finally {
                                  img.close()
                              }
                          }
                          Thread.sleep(120)
                      }
                  }
              }

              private fun startHttpServer() {
                  thread {
                      try {
                          serverSocket = ServerSocket(8080)
                          while (running) {
                              val client = serverSocket?.accept() ?: break
                              thread {
                                  try {
                                      val out = client.getOutputStream()
                                      val header = "HTTP/1.0 200 OK\r\n" +
                                              "Connection: close\r\n" +
                                              "Cache-Control: no-cache\r\n" +
                                              "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n\r\n"
                                      out.write(header.toByteArray())
                                      while (running && !client.isClosed) {
                                          val jpeg = latestJpeg
                                          if (jpeg != null) {
                                              val frameHeader = "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: ${jpeg.size}\r\n\r\n"
                                              out.write(frameHeader.toByteArray())
                                              out.write(jpeg)
                                              out.write("\r\n".toByteArray())
                                              out.flush()
                                          }
                                          Thread.sleep(120)
                                      }
                                  } catch (e: Exception) {
                                  } finally {
                                      client.close()
                                  }
                              }
                          }
                      } catch (e: Exception) {}
                  }
              }

              private fun createNotification() {
                  val chanId = "stream_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(chanId, "Screen Stream", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(chan)
                  }
                  val notif = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, chanId)
                  } else {
                      Notification.Builder(this)
                  }.setContentTitle("مشاركة الشاشة نشطة")
                   .setContentText("يتم بث الشاشة عبر الشبكة المحلية (المنفذ 8080)")
                   .setSmallIcon(android.R.drawable.ic_menu_camera)
                   .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              override fun onDestroy() {
                  running = false
                  try { serverSocket?.close() } catch (e: Exception) {}
                  virtualDisplay?.release()
                  imageReader?.close()
                  projection?.stop()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTier-ScreenShare-APK
          path: app/build/outputs/apk/debug/app-debug.apk
