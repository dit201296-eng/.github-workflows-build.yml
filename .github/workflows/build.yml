name: Stable ZeroTier Screen Streamer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files & Code
        run: |
          mkdir -p app/src/main/java/com/lan/screenshare

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenShareLAN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lan.screenshare'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lan.screenshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.lan.screenshare">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:label="ZeroTier Screen"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".StreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lan/screenshare/MainActivity.kt
          package com.lan.screenshare

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var projMgr: MediaProjectionManager
              private lateinit var statusTxt: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 101)
                      }
                  }

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 80, 50, 50)
                  }

                  statusTxt = TextView(this).apply {
                      text = buildInstructionsText(false)
                      textSize = 16f
                      setTextIsSelectable(true)
                  }

                  val btnStart = Button(this).apply {
                      text = "1. بدء مشاركة الشاشة (تشغيل الخادم)"
                      textSize = 16f
                      setOnClickListener {
                          try {
                              startActivityForResult(projMgr.createScreenCaptureIntent(), 100)
                          } catch (e: Exception) {
                              statusTxt.text = "خطأ في طلب الإذن: ${e.message}"
                          }
                      }
                  }

                  val btnRefresh = Button(this).apply {
                      text = "تحديث عناوين الـ IP"
                      setOnClickListener {
                          statusTxt.text = buildInstructionsText(StreamService.isRunning)
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "إيقاف البث تماماً"
                      setOnClickListener {
                          stopService(Intent(this@MainActivity, StreamService::class.java))
                          statusTxt.text = "تم إيقاف البث.\n\n" + buildInstructionsText(false)
                      }
                  }

                  layout.addView(statusTxt)
                  layout.addView(btnStart)
                  layout.addView(btnRefresh)
                  layout.addView(btnStop)
                  scroll.addView(layout)
                  setContentView(scroll)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, StreamService::class.java).apply {
                          putExtra("code", resultCode)
                          putExtra("data", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      statusTxt.text = buildInstructionsText(true)
                  }
              }

              private fun buildInstructionsText(running: Boolean): String {
                  val ztIp = getZeroTierOrBestIp()
                  val allIps = getAllIps()
                  val state = if (running) "✅ البث يعمل الآن بنجاح في الخلفية!" else "⏸ البث متوقف حالياً (اضغط زر البدء بالأسفل)."
                  return "$state\n\n" +
                         "🔗 للدخول من الهاتف الآخر، افتح المتصفح واكتب في شريط العنوان العلوي هذا الرابط بالضبط:\n\n" +
                         "http://$ztIp:8080\n\n" +
                         "------------------------\n" +
                         "جميع الشبكات المتصلة بالجهاز:\n$allIps\n"
              }

              private fun getZeroTierOrBestIp(): String {
                  var fallbackIp = "127.0.0.1"
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          val name = intf.displayName.lowercase()
                          for (addr in intf.inetAddresses) {
                              val host = addr.hostAddress ?: continue
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  if (name.startsWith("tun") || name.startsWith("zt")) {
                                      return host
                                  }
                                  if (name.startsWith("wlan") || name.startsWith("swlan")) {
                                      fallbackIp = host
                                  } else if (fallbackIp == "127.0.0.1") {
                                      fallbackIp = host
                                  }
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return fallbackIp
              }

              private fun getAllIps(): String {
                  val ips = mutableListOf<String>()
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          for (addr in intf.inetAddresses) {
                              val host = addr.hostAddress ?: continue
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  ips.add("• ${intf.displayName}:  http://$host:8080")
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return if (ips.isEmpty()) "لا يوجد اتصال" else ips.joinToString("\n")
              }
          }

          class StreamService : Service() {
              companion object {
                  @Volatile var isRunning = false
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var serverSocket: ServerSocket? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var handlerThread: HandlerThread? = null
              private var bgHandler: Handler? = null
              @Volatile private var latestJpeg: ByteArray? = null

              private val projCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      cleanup()
                      stopSelf()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createNotification()
                  cleanup()

                  val code = intent?.getIntExtra("code", Activity.RESULT_CANCELED) ?: return START_NOT_STICKY
                  val data: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra("data", Intent::class.java)
                  } else {
                      @Suppress("DEPRECATION")
                      intent.getParcelableExtra("data")
                  }
                  if (data == null) return START_NOT_STICKY

                  try {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ZeroTierScreen::StreamLock").apply {
                          acquire()
                      }

                      handlerThread = HandlerThread("ScreenCaptureThread").apply { start() }
                      bgHandler = Handler(handlerThread!!.looper)

                      val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      projection = mgr.getMediaProjection(code, data)
                      
                      // إجباري في أندرويد 14 لمنع انهيار التطبيق (SecurityException)
                      projection?.registerCallback(projCallback, bgHandler)

                      val metrics = resources.displayMetrics
                      // ضمان أن العرض والطول أرقام زوجية لتجنب أخطاء الذاكرة
                      val width = 720
                      var height = (metrics.heightPixels * (720f / metrics.widthPixels)).toInt()
                      if (height % 2 != 0) height += 1

                      imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
                      virtualDisplay = projection?.createVirtualDisplay(
                          "ZeroTierStream", width, height, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader?.surface, null, bgHandler
                      )

                      isRunning = true
                      startCaptureLoop(width, height)
                      startHttpServer()
                  } catch (e: Exception) {
                      cleanup()
                      stopSelf()
                  }

                  return START_STICKY
              }

              private fun startCaptureLoop(w: Int, h: Int) {
                  thread(start = true, name = "EncoderLoop") {
                      while (isRunning) {
                          var img: android.media.Image? = null
                          try {
                              img = imageReader?.acquireLatestImage()
                              if (img != null) {
                                  val planes = img.planes
                                  val buffer = planes[0].buffer
                                  val pixelStride = planes[0].pixelStride
                                  val rowStride = planes[0].rowStride
                                  val rowPadding = rowStride - pixelStride * w

                                  val bmpWidth = w + rowPadding / pixelStride
                                  val bmp = Bitmap.createBitmap(bmpWidth, h, Bitmap.Config.ARGB_8888)
                                  buffer.rewind()
                                  bmp.copyPixelsFromBuffer(buffer)

                                  val finalBmp = if (bmpWidth != w) {
                                      Bitmap.createBitmap(bmp, 0, 0, w, h)
                                  } else {
                                      bmp
                                  }

                                  val out = ByteArrayOutputStream()
                                  finalBmp.compress(Bitmap.CompressFormat.JPEG, 60, out)
                                  latestJpeg = out.toByteArray()

                                  if (finalBmp !== bmp) finalBmp.recycle()
                                  bmp.recycle()
                              }
                          } catch (e: Throwable) {
                          } finally {
                              try { img?.close() } catch (e: Throwable) {}
                          }
                          try { Thread.sleep(100) } catch (e: Throwable) {}
                      }
                  }
              }

              private fun startHttpServer() {
                  thread(start = true, name = "HttpServerThread") {
                      try {
                          serverSocket = ServerSocket()
                          serverSocket?.reuseAddress = true
                          serverSocket?.bind(InetSocketAddress("0.0.0.0", 8080))

                          while (isRunning) {
                              val client = serverSocket?.accept() ?: break
                              thread(start = true) {
                                  try {
                                      client.soTimeout = 10000
                                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                                      val requestLine = reader.readLine() ?: ""
                                      while (true) {
                                          val line = reader.readLine()
                                          if (line.isNullOrEmpty()) break
                                      }

                                      val out = client.getOutputStream()

                                      if (requestLine.contains("GET /stream")) {
                                          val header = "HTTP/1.1 200 OK\r\n" +
                                                  "Connection: close\r\n" +
                                                  "Cache-Control: no-cache, no-store, must-revalidate\r\n" +
                                                  "Pragma: no-cache\r\n" +
                                                  "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n\r\n"
                                          out.write(header.toByteArray())
                                          out.flush()

                                          while (isRunning && !client.isClosed) {
                                              val jpeg = latestJpeg
                                              if (jpeg != null) {
                                                  val frameHeader = "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: ${jpeg.size}\r\n\r\n"
                                                  out.write(frameHeader.toByteArray())
                                                  out.write(jpeg)
                                                  out.write("\r\n".toByteArray())
                                                  out.flush()
                                              }
                                              Thread.sleep(100)
                                          }
                                      } else {
                                          // صفحة ويب ذكية تعيد الاتصال تلقائياً وتعرض الشاشة بملء المتصفح
                                          val html = """
                                              <!DOCTYPE html>
                                              <html dir="rtl">
                                              <head>
                                                  <meta charset="utf-8">
                                                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                                  <title>شاشة الهاتف المباشرة</title>
                                                  <style>
                                                      body { margin: 0; background: #0d0d0d; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: sans-serif; color: #fff; }
                                                      img { max-width: 100vw; max-height: 95vh; object-fit: contain; }
                                                      .status { position: fixed; top: 8px; background: rgba(0,0,0,0.6); padding: 4px 12px; border-radius: 12px; font-size: 12px; color: #4caf50; }
                                                  </style>
                                              </head>
                                              <body>
                                                  <div class="status" id="st">🟢 متصل بالبث المباشر</div>
                                                  <img id="scr" src="/stream" 
                                                       onerror="document.getElementById('st').innerText='🔄 جاري استعادة الاتصال...'; setTimeout(()=>{this.src='/stream?t='+Date.now()}, 1500);" 
                                                       onload="document.getElementById('st').innerText='🟢 متصل بالبث المباشر';" />
                                              </body>
                                              </html>
                                          """.trimIndent()
                                          val bodyBytes = html.toByteArray(Charsets.UTF_8)
                                          val resp = "HTTP/1.1 200 OK\r\n" +
                                                  "Content-Type: text/html; charset=utf-8\r\n" +
                                                  "Content-Length: ${bodyBytes.size}\r\n" +
                                                  "Connection: close\r\n\r\n"
                                          out.write(resp.toByteArray())
                                          out.write(bodyBytes)
                                          out.flush()
                                      }
                                  } catch (e: Throwable) {
                                  } finally {
                                      try { client.close() } catch (e: Throwable) {}
                                  }
                              }
                          }
                      } catch (e: Throwable) {}
                  }
              }

              private fun createNotification() {
                  val chanId = "stream_channel_v2"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(chanId, "Screen Stream Service", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(chan)
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val notif = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, chanId)
                  } else {
                      Notification.Builder(this)
                  }.setContentTitle("بث الشاشة نشط ومستمر")
                   .setContentText("افتح المتصفح على المنفذ 8080 للمشاهدة")
                   .setSmallIcon(android.R.drawable.ic_menu_view)
                   .setContentIntent(pendingIntent)
                   .setOngoing(true)
                   .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              private fun cleanup() {
                  isRunning = false
                  try { serverSocket?.close() } catch (e: Throwable) {}
                  serverSocket = null
                  try { virtualDisplay?.release() } catch (e: Throwable) {}
                  virtualDisplay = null
                  try { imageReader?.close() } catch (e: Throwable) {}
                  imageReader = null
                  try {
                      projection?.unregisterCallback(projCallback)
                      projection?.stop()
                  } catch (e: Throwable) {}
                  projection = null
                  try { handlerThread?.quitSafely() } catch (e: Throwable) {}
                  handlerThread = null
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                  } catch (e: Throwable) {}
              }

              override fun onDestroy() {
                  cleanup()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTier-ScreenShare-Stable-APK
          path: app/build/outputs/apk/debug/app-debug.apk
