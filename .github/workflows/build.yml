name: Stable ZeroTier Screen Streamer

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Project Files & Code
        run: |
          mkdir -p app/src/main/java/com/lan/screenshare

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ScreenShareLAN"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.lan.screenshare'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lan.screenshare"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "2.2-silent-http"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {}
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.lan.screenshare">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />

              <application
                  android:label="ZeroTier Screen"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar"
                  android:persistent="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".StreamService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/lan/screenshare/MainActivity.kt
          package com.lan.screenshare

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.net.InetSocketAddress
          import java.net.NetworkInterface
          import java.net.ServerSocket
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var projMgr: MediaProjectionManager
              private lateinit var statusTxt: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  projMgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  // طلب تجاهل تحسين البطارية
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                          try {
                              val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                              intent.data = Uri.parse("package:$packageName")
                              startActivity(intent)
                          } catch (e: Exception) {}
                      }
                  }

                  if (Build.VERSION.SDK_INT >= 33) {
                      if (checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 101)
                      }
                  }

                  // تشغيل الخدمة الجاهزة مباشرة
                  val readyIntent = Intent(this, StreamService::class.java)
                  readyIntent.action = "READY"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(readyIntent)
                  } else {
                      startService(readyIntent)
                  }

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(50, 80, 50, 50)
                  }

                  statusTxt = TextView(this).apply {
                      text = buildInstructionsText()
                      textSize = 15f
                      setTextIsSelectable(true)
                  }

                  val btnStart = Button(this).apply {
                      text = "منح إذن التقاط الشاشة (مرة واحدة في الجلسة)"
                      textSize = 15f
                      setOnClickListener {
                          try {
                              startActivityForResult(projMgr.createScreenCaptureIntent(), 100)
                          } catch (e: Exception) {
                              statusTxt.text = "خطأ: ${e.message}"
                          }
                      }
                  }

                  val btnRefresh = Button(this).apply {
                      text = "تحديث الحالة والعناوين"
                      setOnClickListener {
                          statusTxt.text = buildInstructionsText()
                      }
                  }

                  val btnStop = Button(this).apply {
                      text = "إيقاف البث"
                      setOnClickListener {
                          val stopIntent = Intent(this@MainActivity, StreamService::class.java)
                          stopIntent.action = "STOP"
                          startService(stopIntent)
                          statusTxt.text = buildInstructionsText()
                      }
                  }

                  layout.addView(statusTxt)
                  layout.addView(btnStart)
                  layout.addView(btnRefresh)
                  layout.addView(btnStop)
                  scroll.addView(layout)
                  setContentView(scroll)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 100 && resultCode == RESULT_OK && data != null) {
                      val intent = Intent(this, StreamService::class.java).apply {
                          action = "START"
                          putExtra("code", resultCode)
                          putExtra("data", data)
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                      statusTxt.text = buildInstructionsText()
                  }
              }

              private fun buildInstructionsText(): String {
                  val ztIp = getZeroTierOrBestIp()
                  val allIps = getAllIps()
                  val state = when {
                      StreamService.isStreaming -> "✅ البث يعمل الآن"
                      StreamService.isReady -> "🟡 الخدمة جاهزة وتنتظر الأمر"
                      else -> "⏸ الخدمة متوقفة"
                  }
                  return "$state\n\n" +
                         "أوامر التحكم عن بُعد:\n" +
                         "• بدء البث:   http://$ztIp:8080/start\n" +
                         "• إيقاف البث: http://$ztIp:8080/stop\n" +
                         "• مشاهدة:     http://$ztIp:8080\n\n" +
                         "------------------------\n" +
                         "جميع العناوين:\n$allIps\n\n" +
                         "ملاحظة: الإذن مطلوب مرة واحدة فقط طالما لم تُعد تشغيل الهاتف أو تقتل التطبيق."
              }

              private fun getZeroTierOrBestIp(): String {
                  var fallbackIp = "127.0.0.1"
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          val name = intf.displayName.lowercase()
                          for (addr in intf.inetAddresses) {
                              val host = addr.hostAddress ?: continue
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  if (name.startsWith("tun") || name.startsWith("zt")) return host
                                  if (name.startsWith("wlan") || name.startsWith("swlan")) fallbackIp = host
                                  else if (fallbackIp == "127.0.0.1") fallbackIp = host
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return fallbackIp
              }

              private fun getAllIps(): String {
                  val ips = mutableListOf<String>()
                  try {
                      val interfaces = NetworkInterface.getNetworkInterfaces()
                      for (intf in interfaces) {
                          for (addr in intf.inetAddresses) {
                              val host = addr.hostAddress ?: continue
                              if (!addr.isLoopbackAddress && !host.contains(':')) {
                                  ips.add("• ${intf.displayName}: http://$host:8080")
                              }
                          }
                      }
                  } catch (e: Exception) {}
                  return if (ips.isEmpty()) "لا يوجد اتصال" else ips.joinToString("\n")
              }
          }

          class StreamService : Service() {
              companion object {
                  @Volatile var isReady = false
                  @Volatile var isStreaming = false
              }

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var serverSocket: ServerSocket? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var handlerThread: HandlerThread? = null
              private var bgHandler: Handler? = null
              @Volatile private var latestJpeg: ByteArray? = null
              private var savedResultCode: Int = 0
              private var savedData: Intent? = null

              private val projCallback = object : MediaProjection.Callback() {
                  override fun onStop() {
                      stopStreaming()
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      "READY" -> {
                          startReadyMode()
                      }
                      "START" -> {
                          val code = intent.getIntExtra("code", Activity.RESULT_CANCELED)
                          val data = if (Build.VERSION.SDK_INT >= 33) {
                              intent.getParcelableExtra("data", Intent::class.java)
                          } else {
                              @Suppress("DEPRECATION")
                              intent.getParcelableExtra("data")
                          }
                          if (data != null) {
                              savedResultCode = code
                              savedData = data
                              startStreaming(code, data)
                          }
                      }
                      "STOP" -> {
                          stopStreaming()
                      }
                      else -> {
                          startReadyMode()
                      }
                  }
                  return START_STICKY
              }

              private fun startReadyMode() {
                  createSilentNotification("جاهز للبث - في انتظار الأمر")
                  isReady = true
                  isStreaming = false
                  startHttpServer()
                  
                  val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                  if (wakeLock == null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ZeroTierScreen::ReadyLock")
                      wakeLock?.acquire(12 * 60 * 60 * 1000L)
                  }
              }

              private fun startStreaming(code: Int, data: Intent) {
                  try {
                      stopStreamingInternal()

                      createSilentNotification("البث يعمل الآن")

                      handlerThread = HandlerThread("ScreenCaptureThread").apply { start() }
                      bgHandler = Handler(handlerThread!!.looper)

                      val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      projection = mgr.getMediaProjection(code, data)
                      projection?.registerCallback(projCallback, bgHandler)

                      val metrics = resources.displayMetrics
                      val width = 720
                      var height = (metrics.heightPixels * (720f / metrics.widthPixels)).toInt()
                      if (height % 2 != 0) height += 1

                      imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
                      virtualDisplay = projection?.createVirtualDisplay(
                          "ZeroTierStream", width, height, metrics.densityDpi,
                          DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                          imageReader?.surface, null, bgHandler
                      )

                      isStreaming = true
                      isReady = true
                      startCaptureLoop(width, height)
                  } catch (e: Exception) {
                      stopStreaming()
                  }
              }

              private fun stopStreaming() {
                  stopStreamingInternal()
                  createSilentNotification("جاهز للبث - في انتظار الأمر")
                  isStreaming = false
              }

              private fun stopStreamingInternal() {
                  isStreaming = false
                  try { virtualDisplay?.release() } catch (e: Throwable) {}
                  virtualDisplay = null
                  try { imageReader?.close() } catch (e: Throwable) {}
                  imageReader = null
                  try {
                      projection?.unregisterCallback(projCallback)
                      projection?.stop()
                  } catch (e: Throwable) {}
                  projection = null
                  try { handlerThread?.quitSafely() } catch (e: Throwable) {}
                  handlerThread = null
                  latestJpeg = null
              }

              private fun startCaptureLoop(w: Int, h: Int) {
                  thread(start = true, name = "EncoderLoop") {
                      while (isStreaming) {
                          var img: android.media.Image? = null
                          try {
                              img = imageReader?.acquireLatestImage()
                              if (img != null) {
                                  val planes = img.planes
                                  val buffer = planes[0].buffer
                                  val pixelStride = planes[0].pixelStride
                                  val rowStride = planes[0].rowStride
                                  val rowPadding = rowStride - pixelStride * w

                                  val bmpWidth = w + rowPadding / pixelStride
                                  val bmp = Bitmap.createBitmap(bmpWidth, h, Bitmap.Config.ARGB_8888)
                                  buffer.rewind()
                                  bmp.copyPixelsFromBuffer(buffer)

                                  val finalBmp = if (bmpWidth != w) Bitmap.createBitmap(bmp, 0, 0, w, h) else bmp

                                  val out = ByteArrayOutputStream()
                                  finalBmp.compress(Bitmap.CompressFormat.JPEG, 50, out)
                                  latestJpeg = out.toByteArray()

                                  if (finalBmp !== bmp) finalBmp.recycle()
                                  bmp.recycle()
                              }
                          } catch (e: Throwable) {
                          } finally {
                              try { img?.close() } catch (e: Throwable) {}
                          }
                          try { Thread.sleep(100) } catch (e: Throwable) {}
                      }
                  }
              }

              private fun startHttpServer() {
                  if (serverSocket != null && !serverSocket!!.isClosed) return

                  thread(start = true, name = "HttpServerThread") {
                      try {
                          serverSocket = ServerSocket()
                          serverSocket?.reuseAddress = true
                          serverSocket?.bind(InetSocketAddress("0.0.0.0", 8080))

                          while (isReady) {
                              val client = serverSocket?.accept() ?: break
                              thread(start = true) {
                                  handleClient(client)
                              }
                          }
                      } catch (e: Throwable) {}
                  }
              }

              private fun handleClient(client: java.net.Socket) {
                  try {
                      client.soTimeout = 8000
                      val reader = BufferedReader(InputStreamReader(client.getInputStream()))
                      val requestLine = reader.readLine() ?: ""
                      while (true) {
                          val line = reader.readLine()
                          if (line.isNullOrEmpty()) break
                      }

                      val out = client.getOutputStream()
                      val path = requestLine.split(" ").getOrNull(1) ?: "/"

                      when {
                          path.startsWith("/start") -> {
                              if (savedData != null && !isStreaming) {
                                  startStreaming(savedResultCode, savedData!!)
                              }
                              val msg = if (isStreaming) "OK - Streaming started" else "NEED_PERMISSION - Open app and grant screen capture"
                              sendText(out, msg)
                          }
                          path.startsWith("/stop") -> {
                              stopStreaming()
                              sendText(out, "OK - Streaming stopped")
                          }
                          path.startsWith("/stream") -> {
                              if (!isStreaming) {
                                  sendText(out, "Not streaming")
                                  return
                              }
                              val header = "HTTP/1.1 200 OK\r\n" +
                                      "Connection: close\r\n" +
                                      "Cache-Control: no-cache, no-store\r\n" +
                                      "Content-Type: multipart/x-mixed-replace; boundary=frame\r\n\r\n"
                              out.write(header.toByteArray())
                              out.flush()

                              while (isStreaming && !client.isClosed) {
                                  val jpeg = latestJpeg
                                  if (jpeg != null) {
                                      val frameHeader = "--frame\r\nContent-Type: image/jpeg\r\nContent-Length: ${jpeg.size}\r\n\r\n"
                                      out.write(frameHeader.toByteArray())
                                      out.write(jpeg)
                                      out.write("\r\n".toByteArray())
                                      out.flush()
                                  }
                                  Thread.sleep(100)
                              }
                          }
                          else -> {
                              val status = when {
                                  isStreaming -> "🟢 البث يعمل"
                                  isReady -> "🟡 جاهز - في انتظار الأمر"
                                  else -> "🔴 متوقف"
                              }
                              val html = """
                                  <!DOCTYPE html>
                                  <html dir="rtl">
                                  <head>
                                      <meta charset="utf-8">
                                      <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                      <title>شاشة الهاتف</title>
                                      <style>
                                          body { margin:0; background:#111; color:#eee; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; height:100vh; }
                                          .status { margin:12px; padding:8px 16px; background:#222; border-radius:20px; font-size:14px; }
                                          img { max-width:100vw; max-height:85vh; object-fit:contain; }
                                          .btns { margin:10px; }
                                          a { color:#4caf50; margin:0 10px; }
                                      </style>
                                  </head>
                                  <body>
                                      <div class="status" id="st">$status</div>
                                      <div class="btns">
                                          <a href="/start">بدء البث</a> | 
                                          <a href="/stop">إيقاف</a>
                                      </div>
                                      <img id="scr" src="/stream" 
                                           onerror="document.getElementById('st').innerText='🔄 جاري الاتصال...'; setTimeout(()=>{this.src='/stream?t='+Date.now()}, 2000);" />
                                  </body>
                                  </html>
                              """.trimIndent()
                              val body = html.toByteArray(Charsets.UTF_8)
                              val resp = "HTTP/1.1 200 OK\r\nContent-Type: text/html; charset=utf-8\r\nContent-Length: ${body.size}\r\nConnection: close\r\n\r\n"
                              out.write(resp.toByteArray())
                              out.write(body)
                              out.flush()
                          }
                      }
                  } catch (e: Throwable) {
                  } finally {
                      try { client.close() } catch (e: Throwable) {}
                  }
              }

              private fun sendText(out: java.io.OutputStream, text: String) {
                  val body = text.toByteArray(Charsets.UTF_8)
                  val resp = "HTTP/1.1 200 OK\r\nContent-Type: text/plain; charset=utf-8\r\nContent-Length: ${body.size}\r\nConnection: close\r\n\r\n"
                  out.write(resp.toByteArray())
                  out.write(body)
                  out.flush()
              }

              private fun createSilentNotification(text: String) {
                  val chanId = "stream_silent_v4"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val chan = NotificationChannel(chanId, "Screen Stream", NotificationManager.IMPORTANCE_MIN).apply {
                          setShowBadge(false)
                          enableLights(false)
                          enableVibration(false)
                          setSound(null, null)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(chan)
                  }

                  val pending = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  val notif = Notification.Builder(this, chanId)
                      .setContentTitle("ZeroTier Screen")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentIntent(pending)
                      .setOngoing(true)
                      .setPriority(Notification.PRIORITY_MIN)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, notif)
                  }
              }

              override fun onDestroy() {
                  isReady = false
                  stopStreamingInternal()
                  try { serverSocket?.close() } catch (e: Throwable) {}
                  try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (e: Throwable) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent?) {
                  if (intent?.action == Intent.ACTION_BOOT_COMPLETED ||
                      intent?.action?.contains("QUICKBOOT") == true) {
                      val i = Intent(context, MainActivity::class.java)
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      context.startActivity(i)
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeroTier-ScreenShare-Silent-HTTP
          path: app/build/outputs/apk/debug/app-debug.apk
